<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Urban Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bg-mesh antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <header class="fixed top-6 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none">
      <nav id="main-nav" class="pointer-events-auto flex items-center justify-between px-4 py-3 md:px-8 md:py-4 rounded-full glass transition-all duration-500 ease-in-out w-full md:w-[900px]">
        <a href="./index.html" class="flex items-center gap-2 group cursor-pointer">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-blue-500 flex items-center justify-center font-bold text-white group-hover:rotate-12 transition-transform">U</div>
          <span class="font-bold text-lg tracking-tight hidden sm:block text-slate-900">URBAN AGENCY</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="./index.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors">Home</a>
          <a href="./properties.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors">Properties</a>
          <a href="./contact.html" class="text-sm font-semibold text-blue-600 transition-colors">Contact</a>
        </div>
        <div class="flex items-center gap-4">
          <a class="hidden md:flex items-center gap-2 px-5 py-2 bg-slate-900 text-white text-sm font-bold rounded-full hover:bg-blue-600 transition-all transform active:scale-95 shadow-md" href="./contact.html">
            Inquire Now
          </a>
          <button id="mobile-toggle" class="md:hidden w-10 h-10 flex items-center justify-center rounded-full bg-slate-900/5 text-slate-900" aria-label="Toggle mobile menu">Menu</button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden fixed top-24 left-4 right-4 p-6 glass rounded-[2rem] pointer-events-auto z-40">
        <div class="flex flex-col gap-6">
          <a href="./index.html" class="text-2xl font-bold text-slate-900">Home</a>
          <a href="./properties.html" class="text-2xl font-bold text-slate-900">Properties</a>
          <a href="./contact.html" class="text-2xl font-bold text-slate-900">Contact</a>
          <hr class="border-slate-200" />
          <a class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-2xl font-bold shadow-lg text-center" href="./contact.html">Inquire Now</a>
        </div>
      </div>
    </header>

    <main class="pt-32 pb-20 min-h-screen">
      <div class="container mx-auto px-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-20 items-start">
          <div class="lg:col-span-5">
            <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-12 text-slate-900 reveal">
              LET'S <br /> <span class="text-gradient">CONNECT.</span>
            </h1>
            <div class="space-y-12">
              <div class="flex gap-6 reveal">
                <div class="w-16 h-16 rounded-2xl glass flex items-center justify-center flex-shrink-0 bg-white shadow-md"></div>
                <div>
                  <h4 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-1">Email Us</h4>
                  <p class="text-xl font-black text-slate-900">concierge@urbanagency.com</p>
                </div>
              </div>
              <div class="flex gap-6 reveal">
                <div class="w-16 h-16 rounded-2xl glass flex items-center justify-center flex-shrink-0 bg-white shadow-md"></div>
                <div>
                  <h4 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-1">Call Us</h4>
                  <p class="text-xl font-black text-slate-900">+1 (800) URBAN-LIFE</p>
                </div>
              </div>
              <div class="flex gap-6 reveal">
                <div class="w-16 h-16 rounded-2xl glass flex items-center justify-center flex-shrink-0 bg-white shadow-md"></div>
                <div>
                  <h4 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-1">Headquarters</h4>
                  <p class="text-xl font-black text-slate-900">77 Creative Ave, London</p>
                </div>
              </div>
            </div>
            <div class="mt-20 glass rounded-[2.5rem] overflow-hidden aspect-video border border-slate-100 shadow-xl relative reveal">
              <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover grayscale opacity-60" alt="Office Location" />
              <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-12 h-12 bg-blue-600 rounded-full animate-ping opacity-75"></div>
                <div class="absolute w-8 h-8 bg-blue-600 rounded-full border-4 border-white shadow-2xl"></div>
              </div>
            </div>
          </div>

          <div class="lg:col-span-7">
            <div class="glass p-12 md:p-16 rounded-[3.5rem] border border-white bg-white shadow-2xl shadow-slate-200/50 reveal">
              <h2 class="text-3xl font-black mb-10 text-slate-900">Send a Message</h2>
              <form id="contact-form" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div class="group space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 transition-colors group-focus-within:text-blue-600">Full Name</label>
                    <input required type="text" class="w-full bg-transparent border-b border-slate-200 py-4 outline-none focus:border-blue-600 transition-all text-lg font-bold text-slate-900" />
                  </div>
                  <div class="group space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 transition-colors group-focus-within:text-blue-600">Email Address</label>
                    <input required type="email" class="w-full bg-transparent border-b border-slate-200 py-4 outline-none focus:border-blue-600 transition-all text-lg font-bold text-slate-900" />
                  </div>
                </div>
                <div class="group space-y-2">
                  <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 transition-colors group-focus-within:text-blue-600">Subject</label>
                  <select class="w-full bg-transparent border-b border-slate-200 py-4 outline-none focus:border-blue-600 transition-all text-lg font-bold text-slate-900">
                    <option class="bg-white">General Inquiry</option>
                    <option class="bg-white">Property Viewing</option>
                    <option class="bg-white">Sell Your Property</option>
                    <option class="bg-white">Partnership</option>
                  </select>
                </div>
                <div class="group space-y-2">
                  <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 transition-colors group-focus-within:text-blue-600">Your Message</label>
                  <textarea required rows="4" class="w-full bg-transparent border-b border-slate-200 py-4 outline-none focus:border-blue-600 transition-all text-lg font-bold text-slate-900 resize-none"></textarea>
                </div>
                <button id="contact-submit" class="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-xl flex items-center justify-center gap-3 hover:bg-blue-600 active:scale-[0.98] transition-all shadow-xl">Send Message</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
