<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Properties | Urban Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bg-mesh antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <header class="fixed top-6 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none">
      <nav id="main-nav" class="pointer-events-auto flex items-center justify-between px-4 py-3 md:px-8 md:py-4 rounded-full glass transition-all duration-500 ease-in-out w-full md:w-[900px]">
        <a href="./index.html" class="flex items-center gap-2 group cursor-pointer">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-blue-500 flex items-center justify-center font-bold text-white group-hover:rotate-12 transition-transform">U</div>
          <span class="font-bold text-lg tracking-tight hidden sm:block text-slate-900">URBAN AGENCY</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="./index.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors">Home</a>
          <a href="./properties.html" class="text-sm font-semibold text-blue-600 transition-colors">Properties</a>
          <a href="./contact.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors">Contact</a>
        </div>
        <div class="flex items-center gap-4">
          <a class="hidden md:flex items-center gap-2 px-5 py-2 bg-slate-900 text-white text-sm font-bold rounded-full hover:bg-blue-600 transition-all transform active:scale-95 shadow-md" href="./contact.html">
            Inquire Now
          </a>
          <button id="mobile-toggle" class="md:hidden w-10 h-10 flex items-center justify-center rounded-full bg-slate-900/5 text-slate-900" aria-label="Toggle mobile menu">Menu</button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden md:hidden fixed top-24 left-4 right-4 p-6 glass rounded-[2rem] pointer-events-auto z-40">
        <div class="flex flex-col gap-6">
          <a href="./index.html" class="text-2xl font-bold text-slate-900">Home</a>
          <a href="./properties.html" class="text-2xl font-bold text-slate-900">Properties</a>
          <a href="./contact.html" class="text-2xl font-bold text-slate-900">Contact</a>
          <hr class="border-slate-200" />
          <a class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-2xl font-bold shadow-lg text-center" href="./contact.html">Inquire Now</a>
        </div>
      </div>
    </header>

    <main class="pt-32 pb-20 min-h-screen">
      <div class="container mx-auto px-6">
        <div class="mb-20">
          <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-8 text-slate-900 reveal">
            CURATED <br /> <span class="text-gradient">SPACES.</span>
          </h1>
          <div class="flex flex-col md:flex-row gap-6 items-center justify-between">
            <div class="flex flex-wrap gap-2" id="property-categories">
              <button data-filter="All" class="property-filter px-6 py-2 rounded-full text-sm font-black transition-all shadow-sm bg-slate-900 text-white">All</button>
              <button data-filter="Penthouse" class="property-filter px-6 py-2 rounded-full text-sm font-black transition-all shadow-sm glass text-slate-500 hover:text-slate-900">Penthouse</button>
              <button data-filter="Villa" class="property-filter px-6 py-2 rounded-full text-sm font-black transition-all shadow-sm glass text-slate-500 hover:text-slate-900">Villa</button>
              <button data-filter="Loft" class="property-filter px-6 py-2 rounded-full text-sm font-black transition-all shadow-sm glass text-slate-500 hover:text-slate-900">Loft</button>
              <button data-filter="Mansion" class="property-filter px-6 py-2 rounded-full text-sm font-black transition-all shadow-sm glass text-slate-500 hover:text-slate-900">Mansion</button>
            </div>
            <div class="relative w-full md:w-auto">
              <input id="property-search" type="text" placeholder="Search city or style..." class="w-full md:w-80 px-6 py-4 glass rounded-full focus:ring-2 ring-blue-500 outline-none text-slate-900 font-medium placeholder:text-slate-400 shadow-sm" />
            </div>
          </div>
        </div>

        <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <div id="properties-empty" class="hidden text-center py-40">
          <h3 class="text-2xl font-bold text-slate-300">No properties found matching your criteria.</h3>
        </div>
      </div>
    </main>

    <div id="property-modal" class="hidden fixed inset-0 z-[100] items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xl">
      <div class="w-full max-w-6xl glass rounded-[3rem] overflow-hidden max-h-[90vh] overflow-y-auto relative bg-white/95">
        <button id="close-modal" class="absolute top-6 right-6 w-12 h-12 glass rounded-full flex items-center justify-center hover:bg-slate-900 hover:text-white transition-all z-10 shadow-lg text-slate-900">X</button>
        <div class="grid grid-cols-1 lg:grid-cols-2">
          <div class="h-[400px] lg:h-full">
            <img id="modal-image" src="" class="w-full h-full object-cover" alt="Property" />
          </div>
          <div class="p-12 md:p-16">
            <div id="modal-location" class="flex items-center gap-2 text-blue-600 font-black text-sm mb-4"></div>
            <h2 id="modal-title" class="text-5xl font-black mb-6 text-slate-900"></h2>
            <p id="modal-price" class="text-3xl font-black text-slate-600 mb-8"></p>
            <div class="grid grid-cols-3 gap-4 mb-10">
              <div class="glass p-6 rounded-2xl flex flex-col items-center gap-2 border-slate-100 bg-slate-50"><span id="modal-beds" class="font-black text-slate-900"></span></div>
              <div class="glass p-6 rounded-2xl flex flex-col items-center gap-2 border-slate-100 bg-slate-50"><span id="modal-baths" class="font-black text-slate-900"></span></div>
              <div class="glass p-6 rounded-2xl flex flex-col items-center gap-2 border-slate-100 bg-slate-50"><span id="modal-sqft" class="font-black text-slate-900"></span></div>
            </div>
            <p id="modal-description" class="text-slate-500 text-lg leading-relaxed mb-12 font-medium"></p>
            <div class="flex flex-col sm:flex-row gap-4">
              <button class="flex-1 py-5 bg-slate-900 text-white rounded-full font-black text-lg shadow-xl hover:bg-blue-600 transition-colors">Schedule Viewing</button>
              <button class="flex-1 py-5 glass border border-slate-200 rounded-full font-black text-lg text-slate-900 hover:bg-slate-100 transition-colors">Download Brochure</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
